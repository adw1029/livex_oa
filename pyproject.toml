[project]
name = "calcom-assistant"
version = "0.1.0"
description = "Conversational scheduling assistant for cal.com (FastAPI + Claude + MCP)"
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=1.17",
    "mcp>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "truststore>=0.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
