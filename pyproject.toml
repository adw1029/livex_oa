[project]
name = "livex-assistant"
version = "1.0.0"
description = "Chat assistant that manages a cal.com calendar in plain language."
requires-python = ">=3.11"

# Install with `make install` (pip >= 25.1). `app` is also what deploy.sh bundles for Lambda.
[dependency-groups]
app = [
    "anthropic[bedrock]>=1.17",
    "mcp>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "truststore>=0.9",
    "python-dotenv>=1.0",
]
dev = [
    { include-group = "app" },
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long strings (prompts, tool descriptions) read better unwrapped
